<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <aside id="sidebar">
    <h1>feets</h1>
    <label id="dropzone">
      <input id="file-input" type="file" accept=".gpx" multiple hidden>
      Drop GPX files here<br><small>or click to choose</small>
    </label>
    <div id="summary"></div>
    <ul id="track-list"></ul>
    <button id="fit-all" type="button">Zoom to all</button>
  </aside>
  <main id="map"></main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="gpx.js?v=3"></script>
  <script src="store.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
