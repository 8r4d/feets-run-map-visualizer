<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>feets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=26">
</head>
<body>
  <aside id="sidebar">
    <h1>feets</h1>
    <div id="user-bar" hidden>
      <span>Signed in as <strong id="user-name"></strong></span>
      <button id="logout" type="button">Log out</button>
    </div>
    <details id="settings-box" class="panel" hidden>
      <summary>Account</summary>
      <div class="panel-body">
        <button id="change-password" type="button">Change password</button>
        <button id="invite" type="button" title="Invite someone to use feets with their own tracks" hidden>Invite member</button>
        <button id="invite-viewer" type="button" title="Invite someone to look at your map without changing anything" hidden>Invite viewer</button>
        <button id="reset-link" type="button" title="Make a password reset link for someone" hidden>Reset a password</button>
        <button id="view-link-create" type="button" title="A link that shows your map without logging in, e.g. for a club">Share view link</button>
        <ul id="view-link-list" hidden></ul>
      </div>
    </details>
    <details id="import-box" class="panel" hidden>
      <summary>Add tracks <span id="import-summary"></span></summary>
      <div class="panel-body">
        <label id="dropzone">
          <input id="file-input" type="file" accept=".gpx" multiple hidden>
          Drop GPX files here<br><small>or click to choose</small>
        </label>
        <div id="strava" hidden>
          <a id="strava-connect" class="strava-button" href="api.php?action=strava_connect" hidden>Connect with Strava</a>
          <div id="strava-connected" hidden>
            <button id="strava-import" class="strava-button" type="button">Import from Strava</button>
            <button id="strava-disconnect" class="link-button" type="button">Disconnect</button>
          </div>
          <div id="strava-status"></div>
          <div id="strava-auto" hidden>
            <span id="strava-auto-text"></span>
            <button id="strava-auto-toggle" class="link-button" type="button" hidden></button>
          </div>
        </div>
      </div>
    </details>
    <details id="trophies-box" class="panel" hidden>
      <summary>Trophies <span id="trophy-count"></span></summary>
      <div class="panel-body">
        <ul id="trophy-list"></ul>
      </div>
    </details>
    <div id="mode" role="group" aria-label="Map style">
      <button type="button" data-mode="tracks" aria-pressed="true">Tracks</button>
      <button type="button" data-mode="heatmap" aria-pressed="false">Heatmap</button>
      <button type="button" data-mode="streets" aria-pressed="false">Streets</button>
      <button type="button" data-mode="plan" aria-pressed="false">Plan</button>
    </div>
    <label id="fade-control">
      <span>Fade map</span>
      <input id="fade" type="range" min="0" max="90" step="5" value="0">
      <output id="fade-value">0%</output>
    </label>
    <section id="streets-panel" hidden>
      <div class="filter-row">
        <select id="area-select" aria-label="Area"></select>
        <button id="area-add" type="button">Add area</button>
      </div>
      <div id="area-picker" class="filter-row" hidden>
        <select id="area-candidates" aria-label="Areas here"></select>
        <button id="area-confirm" type="button">Add</button>
        <button id="area-cancel" class="link-button" type="button">Cancel</button>
      </div>
      <div id="area-status"></div>
      <div id="coverage"></div>
      <details id="hood-coverage" hidden>
        <summary>By neighbourhood</summary>
        <table></table>
      </details>
      <details id="unrunnable" hidden>
        <summary></summary>
        <ul></ul>
      </details>
      <details id="todo" class="panel" open hidden>
        <summary>Still to run <span class="count"></span></summary>
        <div class="panel-body">
          <small class="hint">Nearest to the middle of the map first</small>
          <ul id="todo-list"></ul>
        </div>
      </details>
      <div id="area-tools" hidden>
        <button id="area-refresh" class="link-button" type="button">Refresh from OpenStreetMap</button>
        <button id="area-remove" class="link-button" type="button">Remove area</button>
      </div>
    </section>
    <section id="plan-panel" hidden>
      <h2 id="plan-title"></h2>
      <div id="plan-stats"></div>
      <label id="plan-streets-toggle"><input id="plan-streets" type="checkbox" checked> Show street coverage</label>
      <div id="plan-edit" class="filter-row">
        <button id="plan-undo" type="button" title="Remove the last point">Undo</button>
        <button id="plan-loop" type="button" title="Route back to the first point">Back to start</button>
        <button id="plan-clear" type="button" title="Start a new route">New</button>
      </div>
      <div class="filter-row">
        <button id="plan-save" type="button">Save</button>
        <button id="plan-gpx" type="button" title="For a watch, or to import into Strava">Download GPX</button>
      </div>
      <div id="plan-status"></div>
      <details id="routes" class="panel" open hidden>
        <summary>Saved routes <span class="count"></span></summary>
        <div class="panel-body">
          <ul id="route-list"></ul>
        </div>
      </details>
    </section>
    <div id="filters">
      <input id="filter-text" type="search" placeholder="Search track names">
      <div class="filter-row">
        <select id="filter-year" aria-label="Year"><option value="">All years</option></select>
        <select id="filter-sport" aria-label="Activity type"><option value="">All types</option></select>
      </div>
      <div class="filter-row">
        <button id="show-all" type="button">Show all</button>
        <button id="hide-all" type="button">Hide all</button>
        <button id="fit-all" type="button">Zoom to all</button>
      </div>
    </div>
    <div id="list-header">
      <div id="summary"></div>
      <button id="edit-toggle" type="button" aria-pressed="false" title="Show delete buttons">Edit</button>
    </div>
    <ul id="track-list"></ul>
    <button id="more" type="button" hidden>Show more</button>
  </aside>
  <main id="map"></main>
  <div id="toasts" aria-live="polite"></div>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2 id="name-dialog-title"></h2>
      <input id="name-dialog-input" maxlength="255" required pattern=".*\S.*" title="Type a name" autocomplete="off">
      <div class="dialog-buttons">
        <!-- OK comes first so Enter picks it; the row is reversed in style.css -->
        <button id="name-dialog-ok" value="ok" type="submit"></button>
        <button value="cancel" type="submit" formnovalidate class="link-button">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="auth" hidden>
    <form id="auth-form">
      <h2 id="auth-title"></h2>
      <p id="auth-intro"></p>
      <input id="auth-setup" type="password" placeholder="Setup password (app_password)" autocomplete="off" hidden>
      <input id="auth-current" type="password" placeholder="Current password" autocomplete="current-password" hidden>
      <input id="auth-username" placeholder="Username" autocomplete="username" required>
      <input id="auth-password" type="password" placeholder="Password" required>
      <button id="auth-submit" type="submit"></button>
      <p id="auth-error"></p>
      <button id="auth-forgot" class="link-button" type="button" hidden>Forgot password?</button>
      <button id="auth-cancel" class="link-button" type="button" hidden>Cancel</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="gpx.js?v=18"></script>
  <script src="store.js?v=25"></script>
  <script src="osm.js?v=18"></script>
  <script src="coverage.js?v=22"></script>
  <script src="planner.js?v=23"></script>
  <script src="achievements.js?v=22"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
