<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- feets' icon: two footprints. Full-bleed, so it can be cropped to any
       shape; everything sits inside the middle 80% (the "maskable" safe zone).
       The PNGs beside it are made from this (see README, "App icon"). -->
  <rect width="512" height="512" fill="#2a7ae2"/>
  <g fill="#fff" transform="translate(256 256) scale(0.95) translate(-268 -240)">
    <!-- left foot, big toe on the inside (right) -->
    <g transform="translate(196 300) rotate(-14) scale(-1 1)">
      <path d="M-34 -58 C-50 -10 -44 40 -30 70 C-20 92 20 92 30 70 C42 40 50 -10 36 -58 C26 -92 -24 -92 -34 -58 Z"/>
      <circle cx="-30" cy="-112" r="15"/><circle cx="-2" cy="-122" r="13"/><circle cx="22" cy="-116" r="11.5"/>
      <circle cx="40" cy="-102" r="10"/><circle cx="52" cy="-84" r="8.5"/>
    </g>
    <!-- right foot, a step ahead -->
    <g transform="translate(330 220) rotate(14)">
      <path d="M-34 -58 C-50 -10 -44 40 -30 70 C-20 92 20 92 30 70 C42 40 50 -10 36 -58 C26 -92 -24 -92 -34 -58 Z"/>
      <circle cx="-30" cy="-112" r="15"/><circle cx="-2" cy="-122" r="13"/><circle cx="22" cy="-116" r="11.5"/>
      <circle cx="40" cy="-102" r="10"/><circle cx="52" cy="-84" r="8.5"/>
    </g>
  </g>
</svg>
